<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditing ? 'Edit Address' : 'Add New Address' }}</h2>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>

    <form [formGroup]="addressForm" (ngSubmit)="saveAddress()">
      <div class="form-group">
        <label for="name">Full Name *</label>
        <input 
          type="text" 
          id="name" 
          formControlName="name"
          placeholder="Enter your full name"
          class="form-control"
          [class.is-invalid]="isFieldInvalid('name')">
        <span class="error-text" *ngIf="isFieldInvalid('name')">
          Name is required (minimum 3 characters)
        </span>
      </div>

      <div class="form-group">
        <label for="street">Street Address *</label>
        <input 
          type="text" 
          id="street" 
          formControlName="street"
          placeholder="Enter street address"
          class="form-control"
          [class.is-invalid]="isFieldInvalid('street')">
        <span class="error-text" *ngIf="isFieldInvalid('street')">
          Street address is required
        </span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="city">City *</label>
          <input 
            type="text" 
            id="city" 
            formControlName="city"
            placeholder="Enter city"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('city')">
          <span class="error-text" *ngIf="isFieldInvalid('city')">
            City is required
          </span>
        </div>

        <div class="form-group">
          <label for="state">State *</label>
          <input 
            type="text" 
            id="state" 
            formControlName="state"
            placeholder="Enter state"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('state')">
          <span class="error-text" *ngIf="isFieldInvalid('state')">
            State is required
          </span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="pincode">PIN Code *</label>
          <input 
            type="text" 
            id="pincode" 
            formControlName="pincode"
            placeholder="6-digit PIN code"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('pincode')">
          <span class="error-text" *ngIf="isFieldInvalid('pincode')">
            Valid 6-digit PIN code required
          </span>
        </div>

        <div class="form-group">
          <label for="mobile">mobile Number *</label>
          <input 
            type="text" 
            id="mobile" 
            formControlName="mobile"
            placeholder="10-digit mobile number"
            class="form-control"
            [class.is-invalid]="isFieldInvalid('mobile')">
          <span class="error-text" *ngIf="isFieldInvalid('mobile')">
            Valid 10-digit mobile number required
          </span>
        </div>
      </div>

      <div class="form-group">
        <label for="type">Address Type *</label>
        <select id="type" formControlName="type" class="form-control" [class.is-invalid]="isFieldInvalid('type')">
          <option value="">Select type</option>
          <option value="Home">Home</option>
          <option value="Work">Work</option>
          <option value="Other">Other</option>
        </select>
        <span class="error-text" *ngIf="isFieldInvalid('type')">
          Please select an address type
        </span>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-save" [disabled]="!addressForm.valid">
          {{ isEditing ? 'Update Address' : 'Save Address' }}
        </button>
      </div>
    </form>
  </div>
</div>
