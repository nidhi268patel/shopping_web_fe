<div class="card">
          <div class="card-header">
            <h3>Registered Users</h3>
          </div>
          <div class="card-body table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Joined</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let user of users">
                  <td>{{ user.id }}</td>
                  <td><strong>{{ user.name }}</strong></td>
                  <td>{{ user.email }}</td>
                  <td><span class="role-text">{{ user.role }}</span></td>
                  <td>{{ user.createdAt| date:'mediumDate' }}</td>
                  <td>
                    <span class="badge" [ngClass]="user.status === 'Active' ? 'badge-delivered' : 'badge-cancelled'">
                      {{ user.status }}
                    </span>
                  </td>
                  <td>
                    <button class="btn btn-sm" [ngClass]="user.status === 'Active' ? 'btn-danger' : 'btn-success'" (click)="toggleUserStatus(user)">
                      {{ user.status === 'Active' ? 'Suspend' : 'Activate' }}
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
